{% extends 'base.html' %}

{% block content %}
<header class="header">
    <h1>{{ title }}</h1>
</header>

<main class="content-container">
    <div class="form-card">
        <form action="{{ form_action }}" method="POST" class="form-single-column">
            <div class="form-group">
                <label for="report_name">Report Name</label>
                <div class="input-wrapper">
                    <i data-lucide="file-text"></i>
                    <input type="text" name="report_name" id="report_name" class="form-control" value="{{ report.report_name if report and report.report_name else '' }}" placeholder="e.g. Monthly Portfolio Report" maxlength="100" required>
                </div>
            </div>

            <div class="form-group">
                <label for="trust_id">Managed Trust</label>
                <div class="select-wrapper">
                    <select id="trust_id" name="trust_id" class="form-control">
                        <option value="">No Trust</option>
                        {% for trust in trusts %}
                            <option value="{{ trust.trust_id }}" {% if report and report.trust_id == trust.trust_id %}selected{% endif %}>{{ trust.trust_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="report_date">Report Date</label>
                <div class="input-wrapper">
                    <i data-lucide="calendar"></i>
                    <input type="date" name="report_date" id="report_date" class="form-control" value="{{ report.report_date if report and report.report_date else '' }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea name="description" id="description" class="form-control" rows="4" maxlength="500" placeholder="Optional notes about this report">{{ report.description if report and report.description else '' }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    <i data-lucide="check" size="18"></i> Save Report
                </button>
                <a href="{{ url_for('reports.reports') }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
{% endblock %}
