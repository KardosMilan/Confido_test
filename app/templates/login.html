<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CONFIDO</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --primary: #c5a059;
            --primary-hover: #b08d48;
            --accent-blue: #1a73e8;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Az eredeti Confido kártya modernebb változata */
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 48px 40px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        /* Márkajelzés az eredeti stílusban */
        .brand-container {
            margin-bottom: 28px;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .brand-subtitle {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Fejléc és leírás */
        .login-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        /* Modern, letisztult Google Gomb */
        .btn-google {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background-color: #ffffff;
            color: #3c4043;
            border: 1px solid var(--border-color);
            border-radius: calc(var(--radius) - 4px);
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        .btn-google:hover {
            background-color: #f8fafc;
            border-color: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.12);
            transform: translateY(-1px);
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        /* Alsó biztonsági sáv */
        .footer-info {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .footer-info i {
            color: var(--accent-blue);
        }

        .copyright {
            margin-top: 12px;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Confido Brand -->
        <div class="brand-container">
            <div class="brand-title">CONFIDO</div>
            <div class="brand-subtitle">Bizalmi Vagyonkezelő Zrt.</div>
        </div>

        <!-- Login Header -->
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Sign in to access your portal</p>
        </div>

        <!-- Google OAuth Button -->
        <a href="{{ url_for('auth.google_login') }}" class="btn-google">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Sign in with Google</span>
        </a>

        <!-- Security Footer -->
        <div class="footer-info">
            <i data-lucide="shield-check" size="15"></i>
            <span>Protected Corporate Access</span>
        </div>

        <div class="copyright">
            &copy; 2026 Confido Zrt. All rights reserved.
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
