{% extends 'base.html' %}

{% block content %}

<header class="header">
    <h1>Banks</h1>
    <div class="action-toolbar">
        <a href="{{ url_for('banks.new_bank') }}" class="btn-primary">
            + New Bank
        </a>
    </div>
</header>

<main class="content-container">
    <div class="card-full">
        <div class="table-responsive">
            <table class="account-table">
                <thead>
                    <tr>
                        <th>Bank ID</th>
                        <th>Bank Name</th>
                        <th>Region</th>
                        <th class="amount">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for bank in banks %}
                    <tr>
                        <td><strong>{{ bank.bank_id or 'N/A'}}</strong></td>
                        <td>{{ bank.bank_name or 'N/A'}}</td>
                        <td><span class="badge badge-active">{{ bank.region or 'N/A'}}</span></td>
                        <td class="amount">
                            <div class="button-group">
                                <a href="{{ url_for('banks.edit_bank', id=bank.bank_id) }}" class="btn-secondary btn-xs">Edit</a>
                                <form action="{{ url_for('banks.delete_bank', id=bank.bank_id) }}" method="POST" class="delete-form" data-confirm-word="delete">
                                    <button type="submit" class="btn-danger btn-xs">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    {% else %}
                    <tr class="empty-row"><td colspan="4">No available banks</td></tr>
                    {% endfor %}

                </tbody>
            </table>
        </div>
    </div>

</main>
{% endblock %}
