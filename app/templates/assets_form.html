{% extends 'base.html' %}

{% block content %}

<header class="header">
    <h1>{{ title }}</h1>
</header>

<main class="content-container">
    <div class="form-card">
        <form id="asset_form" action="{{ form_action }}" method="POST" class="form-single-column">
            <div class="form-group">
                <label for="asset_type">Asset Type</label>
                <div class="select-wrapper">
                    <select id="asset_type" name="asset_type" class="form-control" required>
                        <option value="" disabled {{ 'selected' if not asset or not asset.asset_type }}>Select Asset Type...</option>
                        {% for t in asset_types %}
                            <option value="{{ t }}" {% if asset and asset.asset_type == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group asset-field" data-types='{{ asset_types | tojson }}'>
                <label for="asset_name">Asset Name</label>
                <div class="input-wrapper">
                    <i data-lucide="tag"></i>
                    <input type="text" name="asset_name" id="asset_name" class="form-control" value="{{ asset.asset_name if asset and asset.asset_name else '' }}" placeholder="e.g. Hungarian Government Bond 2030/A" maxlength="100">
                </div>
            </div>

            <div class="form-group asset-field" data-types='{{ asset_types | tojson }}'>
                <label for="currency_id">Currency</label>
                <div class="select-wrapper">
                    <select id="currency_id" name="currency_id" class="form-control">
                        <option value="" disabled {{ 'selected' if not asset or not asset.currency_id }}>Select Currency...</option>
                        {% for c in currencies %}
                            <option value="{{ c.id }}" {% if asset and asset.currency_id == c.id %}selected{% endif %}>{{ c.code }} - {{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group asset-field" data-types='{{ field_types.isin | tojson }}'>
                <label for="isin">ISIN</label>
                <div class="input-wrapper">
                    <i data-lucide="barcode"></i>
                    <input type="text" name="isin" id="isin" class="form-control" value="{{ asset.isin | isin if asset and asset.isin else '' }}" placeholder="e.g. HU00 0040 3019" maxlength="14" data-format="isin" autocomplete="off">
                </div>
            </div>

            <div class="form-group asset-field" data-types='{{ field_types.nominal_value | tojson }}'>
                <label for="nominal_value">Nominal Value</label>
                <div class="input-wrapper">
                    <i data-lucide="coins"></i>
                    <input type="number" name="nominal_value" id="nominal_value" class="form-control" value="{{ asset.nominal_value if asset and asset.nominal_value is not none else '' }}" placeholder="e.g. 10000" min="0.01" step="0.01">
                </div>
            </div>

            <div class="form-group asset-field" data-types='{{ field_types.price_decimals | tojson }}'>
                <label for="price_decimals">Price Quotation Decimals</label>
                <div class="input-wrapper">
                    <i data-lucide="hash"></i>
                    <input type="number" name="price_decimals" id="price_decimals" class="form-control" value="{{ asset.price_decimals if asset and asset.price_decimals is not none else '' }}" placeholder="e.g. 4" min="0" max="10" step="1">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    <i data-lucide="check" size="18"></i> Save Asset
                </button>
                <a href="{{ cancel_url }}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const typeSelect = document.getElementById('asset_type');
    const fieldGroups = document.querySelectorAll('.asset-field');

    function updateAssetFields() {
        const selectedType = typeSelect.value;
        fieldGroups.forEach(group => {
            const visible = JSON.parse(group.dataset.types).includes(selectedType);
            group.hidden = !visible;
            group.querySelectorAll('input, select').forEach(input => {
                input.disabled = !visible;
                input.required = visible;
            });
        });
    }

    typeSelect.addEventListener('change', updateAssetFields);
    updateAssetFields();
});
</script>

</main>
{% endblock %}
